<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSClassic Deck Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:      #c9a84c;
    --gold-light:#f0d080;
    --gold-dim:  #7a5f28;
    --bg-deep:   #0d0b07;
    --bg-panel:  #16120a;
    --bg-card:   #1e1810;
    --bg-hover:  #2a2115;
    --border:    #3a2e18;
    --border-hi: #5a4520;
    --text:      #e8d9b0;
    --text-dim:  #8a7550;
    --red:       #c0392b;
    --blue:      #2980b9;
    --green:     #27ae60;
    --purple:    #8e44ad;

    --rarity-free:      #aaa;
    --rarity-common:    #e0e0e0;
    --rarity-rare:      #4a90d9;
    --rarity-epic:      #b45ee4;
    --rarity-legendary: #f0a033;

    /* Class accent colors */
    --cls-DRUID:       #c67c2e;
    --cls-HUNTER:      #4a8f3f;
    --cls-MAGE:        #69b2e8;
    --cls-PALADIN:     #e8d860;
    --cls-PRIEST:      #e8e8e8;
    --cls-ROGUE:       #b0b0b0;
    --cls-SHAMAN:      #5b7fd4;
    --cls-WARLOCK:     #9b59b6;
    --cls-WARRIOR:     #c0392b;
    --cls-NEUTRAL:     #8a7550;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Crimson Text', serif;
    background: var(--bg-deep);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(201,168,76,0.06) 0%, transparent 60%),
      url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a84c' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }

  /* ─── HEADER ─────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    height: 54px;
    background: linear-gradient(180deg, #1a1408 0%, #120f06 100%);
    border-bottom: 1px solid var(--border-hi);
    box-shadow: 0 2px 20px rgba(0,0,0,0.6);
    flex-shrink: 0;
    z-index: 10;
  }

  .logo {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 1.3rem;
    color: var(--gold-light);
    letter-spacing: 0.12em;
    text-shadow: 0 0 20px rgba(201,168,76,0.4);
  }

  .header-actions { display: flex; gap: 10px; align-items: center; }

  .btn {
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    padding: 7px 16px;
    border-radius: 3px;
    border: 1px solid var(--border-hi);
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .btn-ghost {
    background: transparent;
    color: var(--text-dim);
  }
  .btn-ghost:hover { color: var(--gold); border-color: var(--gold-dim); background: rgba(201,168,76,0.05); }

  .btn-gold {
    background: linear-gradient(135deg, #b8922a 0%, #d4a840 50%, #b8922a 100%);
    color: #1a1000;
    border-color: var(--gold);
    box-shadow: 0 0 12px rgba(201,168,76,0.2);
  }
  .btn-gold:hover { box-shadow: 0 0 20px rgba(201,168,76,0.4); transform: translateY(-1px); }

  .btn-danger {
    background: transparent;
    color: #c0392b;
    border-color: #7a1a1a;
  }
  .btn-danger:hover { background: rgba(192,57,43,0.1); border-color: #c0392b; }

  /* ─── LAYOUT ──────────────────────────────────── */
  .layout {
    display: grid;
    grid-template-columns: 260px 1fr 300px;
    flex: 1;
    overflow: hidden;
  }

  /* ─── FILTER SIDEBAR ──────────────────────────── */
  .sidebar {
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    overflow-y: auto;
  }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); }

  .sidebar-section {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .section-label {
    font-family: 'Cinzel', serif;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .search-wrap { position: relative; }
  .search-wrap input {
    width: 100%;
    background: var(--bg-deep);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: 'Crimson Text', serif;
    font-size: 0.95rem;
    padding: 7px 10px 7px 32px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--gold-dim); }
  .search-wrap::before {
    content: '⚲';
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%) scaleX(-1);
    color: var(--text-dim);
    font-size: 1rem;
    pointer-events: none;
  }

  /* Active class banner */
  .active-class-banner {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: rgba(201,168,76,0.06);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .active-class-banner.visible { display: flex; }
  .active-class-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .active-class-label {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    font-weight: 600;
    flex: 1;
  }
  .clear-class-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 0.75rem;
    cursor: pointer;
    transition: color 0.15s;
    font-family: 'Cinzel', serif;
  }
  .clear-class-btn:hover { color: var(--gold); }

  /* Mana filter */
  .mana-filter {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }

  .mana-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #3a5fa0, #1a3060);
    border: 2px solid #2a4a80;
    color: #fff;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mana-btn:hover, .mana-btn.active {
    border-color: var(--gold);
    box-shadow: 0 0 10px rgba(201,168,76,0.4);
    transform: scale(1.1);
  }
  .mana-btn.active { background: radial-gradient(circle at 40% 35%, #5a7fc0, #2a5090); }

  /* Class filter */
  .class-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
  }

  .class-btn {
    padding: 5px 8px;
    border-radius: 3px;
    background: var(--bg-deep);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    text-align: center;
  }
  .class-btn:hover { border-color: var(--border-hi); color: var(--text); }
  .class-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.08); }

  /* Type / Rarity */
  .pill-row { display: flex; gap: 5px; flex-wrap: wrap; }
  .pill {
    padding: 4px 10px;
    border-radius: 20px;
    background: var(--bg-deep);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Cinzel', serif;
    font-size: 0.58rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
  }
  .pill:hover { border-color: var(--border-hi); color: var(--text); }
  .pill.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.08); }

  .load-btn-wrap {
    padding: 14px 16px;
    flex-shrink: 0;
  }
  #fileInput { display: none; }

  .card-count-info {
    padding: 8px 16px;
    font-size: 0.8rem;
    color: var(--text-dim);
    font-style: italic;
    flex-shrink: 0;
  }

  /* ─── CARD GRID ───────────────────────────────── */
  .card-browser {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg-deep);
  }

  .card-grid-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  .card-grid-wrap::-webkit-scrollbar { width: 6px; }
  .card-grid-wrap::-webkit-scrollbar-track { background: var(--bg-deep); }
  .card-grid-wrap::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 3px; }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
  }

  /* ─── CLASS GROUP HEADER ──────────────────────── */
  .class-group-header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 2px 4px;
    margin-top: 6px;
  }
  .class-group-header:first-child { margin-top: 0; }

  .class-group-pip {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .class-group-label {
    font-family: 'Cinzel', serif;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .class-group-count {
    font-family: 'Cinzel', serif;
    font-size: 0.55rem;
    color: var(--text-dim);
    font-style: italic;
    margin-left: 2px;
  }

  .class-group-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--border-hi) 0%, transparent 100%);
  }

  /* ─── CARD ITEMS ──────────────────────────────── */
  .card-item {
    border-radius: 6px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
    aspect-ratio: 0.72;
    display: flex;
    flex-direction: column;
  }
  .card-item:hover {
    border-color: var(--gold-dim);
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 0 1px rgba(201,168,76,0.2);
    z-index: 2;
  }
  .card-item.maxed { opacity: 0.4; cursor: not-allowed; }
  .card-item.maxed:hover { transform: none; box-shadow: none; }

  .card-img-wrap {
    flex: 1;
    overflow: hidden;
    position: relative;
    background: #0a0806;
  }
  .card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s;
  }
  .card-item:hover .card-img-wrap img { transform: scale(1.05); }

  .card-img-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--text-dim);
    font-size: 0.7rem;
    font-style: italic;
    padding: 8px;
    text-align: center;
  }

  .card-footer {
    padding: 5px 7px 6px;
    background: linear-gradient(180deg, rgba(13,11,7,0) 0%, rgba(13,11,7,0.95) 30%, #0d0b07 100%);
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
  }

  .card-name {
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    font-weight: 600;
    color: var(--gold-light);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 2px;
  }

  .mana-gem {
    background: radial-gradient(circle at 40% 35%, #3a5fa0, #1a3060);
    border: 1px solid #2a4a80;
    border-radius: 50%;
    width: 16px;
    height: 16px;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 0.6rem;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .attack-gem {
    background: radial-gradient(circle at 40% 35%, #aa751a, #e0a030);
    border: 1px solid #e0a030;
    border-radius: 50%;
    width: 16px;
    height: 16px;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 0.6rem;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .health-gem {
    background: radial-gradient(circle at 40% 35%, #7a1a1a, #e05050);
    border: 1px solid #e05050;
    border-radius: 50%;
    width: 16px;
    height: 16px;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 0.6rem;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .card-type-rarity {
    font-size: 0.55rem;
    color: var(--text-dim);
    font-style: italic;
    flex: 1;
    text-align: left;
  }

  .card-type-tag {
    font-size: 0.55rem;
    color: var(--text-dim);
    font-style: italic;
    flex: 1;
    text-align: right;
  }

  .in-deck-badge {
    position: absolute;
    top: 5px;
    right: 5px;
    background: rgba(201,168,76,0.9);
    color: #1a1000;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 0.65rem;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
  }

  .empty-state {
    grid-column: 1/-1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .empty-state .big-icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.3; }
  .empty-state p { font-size: 1rem; font-style: italic; }

  /* ─── DECK PANEL ──────────────────────────────── */
  .deck-panel {
    background: var(--bg-panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

    /* Class accent stripe on deck panel */
  .deck-class-stripe {
    height: 3px;
    flex-shrink: 0;
    background: var(--gold-dim);
    transition: background 0.4s;
  }

  .deck-header {
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .deck-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .deck-class-badge {
    font-family: 'Cinzel', serif;
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 2px;
    border: 1px solid currentColor;
    opacity: 0.8;
    transition: color 0.3s, border-color 0.3s;
    color: var(--text-dim);
  }

  .deck-name-input {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border-hi);
    color: var(--gold-light);
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    font-weight: 600;
    width: 140px;
    outline: none;
    padding-bottom: 2px;
    letter-spacing: 0.05em;
  }
  .deck-name-input:focus { border-bottom-color: var(--gold); }
  .deck-name-input::placeholder { color: var(--text-dim); font-weight: 400; }

  .deck-count-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .deck-count {
    font-family: 'Cinzel', serif;
    font-size: 0.9rem;
    font-weight: 700;
  }
  .deck-count .num { color: var(--gold-light); }
  .deck-count .denom { color: var(--text-dim); font-size: 0.7em; }

    /* Mana curve bars */
  .mana-curve {
    display: flex;
    gap: 3px;
    align-items: flex-end;
    height: 30px;
  }

  .curve-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .curve-bar-wrap {
    width: 100%;
    height: 22px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .curve-bar {
    width: 70%;
    background: linear-gradient(180deg, #4a7fd0 0%, #1a3060 100%);
    border-radius: 2px 2px 0 0;
    transition: height 0.3s ease;
    min-height: 0;
  }
  .curve-label {
    font-family: 'Cinzel', serif;
    font-size: 0.45rem;
    color: var(--text-dim);
  }

  .deck-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .deck-scroll::-webkit-scrollbar { width: 4px; }
  .deck-scroll::-webkit-scrollbar-track { background: transparent; }
  .deck-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .deck-entry {
    display: flex;
    align-items: center;
    padding: 4px 14px 4px 12px;
    gap: 8px;
    border-bottom: 1px solid rgba(58,46,24,0.3);
    transition: background 0.15s;
    cursor: default;
    position: relative;
  }
  .deck-entry:hover { background: var(--bg-hover); }

  .deck-entry-mana {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #3a5fa0, #1a3060);
    border: 1px solid #2a4a80;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 0.7rem;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .deck-entry-thumb {
    width: 28px;
    height: 28px;
    border-radius: 2px;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--bg-deep);
  }
  .deck-entry-thumb img {
    width: 200%;
    height: 200%;
    object-fit: cover;
    object-position: 20% 15%;
    margin-left: -50%;
    margin-top: -10%;
  }

  .deck-entry-name {
    flex: 1;
    font-family: 'Cinzel', serif;
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .deck-entry-name.legendary { color: var(--rarity-legendary); }

  .deck-entry-count {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 0.75rem;
    color: var(--gold);
    width: 14px;
    text-align: center;
  }

  .deck-remove-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.9rem;
    line-height: 1;
    padding: 0 2px;
    transition: color 0.15s;
    opacity: 0;
  }
  .deck-entry:hover .deck-remove-btn { opacity: 1; }
  .deck-remove-btn:hover { color: #e74c3c; }

  .deck-footer {
    border-top: 1px solid var(--border);
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    flex-shrink: 0;
  }

  .deck-footer-row { display: flex; gap: 8px; }
  #saveDeckBtn, #exportBtn, #clearBtn {
    flex: 1;
    font-size: 0.6rem;
    padding: 7px 6px;
    text-align: center;
  }

  /* ─── CLASS CHOOSER MODAL ──────────────────────── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(6px);
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--bg-panel);
    border: 1px solid var(--border-hi);
    border-radius: 8px;
    width: 540px;
    max-width: 96vw;
    box-shadow: 0 24px 70px rgba(0,0,0,0.85), 0 0 0 1px rgba(201,168,76,0.08);
  }

  .modal-header {
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-title {
    font-family: 'Cinzel', serif;

<!-- ─── NOTIFICATION ─────────────────────── -->
<div class="notif" id="notif"></div>

<script>
// ─── CLASS DATA ─────────────────────────────────────────────────────────────
const CLASS_DISPLAY = {
  DRUID:'Druid', HUNTER:'Hunter', MAGE:'Mage',
  PALADIN:'Paladin', PRIEST:'Priest', ROGUE:'Rogue',
  SHAMAN:'Shaman', WARLOCK:'Warlock', WARRIOR:'Warrior',
  NEUTRAL:'Neutral'
};
const CLASS_ICONS = {
  DRUID:'🌿', HUNTER:'🏹', MAGE:'🔮',
  PALADIN:'⚔️', PRIEST:'✝️', ROGUE:'🗝️',
  SHAMAN:'⚡', WARLOCK:'👁️', WARRIOR:'🛡️',
  NEUTRAL:'⚖️'
};
const CLASS_COLORS = {
  DRUID:'#c67c2e', HUNTER:'#4a8f3f', MAGE:'#69b2e8',
  PALADIN:'#e8d860', PRIEST:'#e8e8e8', ROGUE:'#b0b0b0',
  SHAMAN:'#5b7fd4', WARLOCK:'#9b59b6', WARRIOR:'#c0392b',
  NEUTRAL:'#8a7550'
};

// Canonical display order for classes (deck class first when set, then alpha, neutral last)
const CLASS_ORDER = ['DRUID','HUNTER','MAGE','PALADIN','PRIEST','ROGUE','SHAMAN','WARLOCK','WARRIOR','NEUTRAL'];

// ─── STATE ──────────────────────────────────────────────────────────────────
let allCards = [];
let filteredCards = [];
let deck = []; // [{card, count}]
let deckClass = null; // chosen hero class for this deck
let currentDeckId = null; // localStorage ID of the currently loaded deck
let groupByClass = true; // ← on by default

const filters = {
  search: '',
  mana: new Set(),
  classes: new Set(),
  types: new Set(),
  rarities: new Set(),
};
let sortBy = 'mana';

// ─── HELPERS ────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const imgUrl = id => `https://art.hearthstonejson.com/v1/render/latest/enUS/512x/${id}.png`;
let notifTimer;
function notify(msg) {
  const n = $('notif');
  n.textContent = msg;
  n.classList.add('show');
  clearTimeout(notifTimer);
  notifTimer = setTimeout(() => n.classList.remove('show'), 2400);
}

// ─── LOCAL STORAGE HELPERS ──────────────────────────────────────────────────
const STORAGE_KEY = 'hsclassic_saved_decks';

function getSavedDecks() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch { return []; }
}

function setSavedDecks(decks) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(decks)); }
  catch (e) { notify('Storage error — could not save'); }
}

function saveDeck() {
  if (deck.length === 0) { notify('Nothing to save — deck is empty'); return; }
  const name = $('deckNameInput').value.trim() || 'My Deck';
  const decks = getSavedDecks();

  // Minimal card snapshot (only what we need to restore the deck)
  const cardSnapshot = deck.map(({ card, count }) => ({
    count,
    card: {
      id: card.id, name: card.name, cost: card.cost, type: card.type,
      rarity: card.rarity, cardClass: card.cardClass,
      attack: card.attack, health: card.health, durability: card.durability,
      text: card.text
    }
  }));

  if (currentDeckId) {
    // Update existing
    const idx = decks.findIndex(d => d.id === currentDeckId);
    if (idx !== -1) {
      decks[idx] = { ...decks[idx], name, class: deckClass, cards: cardSnapshot, updated: Date.now() };
      setSavedDecks(decks);
      notify(`✓ Deck "${name}" updated`);
      return;
    }
  }

  // New save
  const id = 'deck_' + Date.now();
  currentDeckId = id;
  decks.unshift({ id, name, class: deckClass, cards: cardSnapshot, created: Date.now() });
  setSavedDecks(decks);
  notify(`✓ Deck "${name}" saved`);
}

function loadDeckFromSave(saved) {
  $('savedDecksModal').classList.remove('open');
  deck = saved.cards.map(({ card, count }) => ({ card, count }));
  $('deckNameInput').value = saved.name || 'My Deck';
  deckClass = saved.class || null;
  currentDeckId = saved.id;

  filters.classes.clear();
  filters.classes.add(saved.class);
  filters.classes.add('NEUTRAL');

  // Reflect in sidebar class buttons
  document.querySelectorAll('#classFilter .class-btn').forEach(btn => {
    const active = filters.classes.has(btn.dataset.class);
    btn.classList.toggle('active', active);
  });
  applyFilters();

  applyDeckClassToUI();
  renderDeck();
  renderCards();
  notify(`✓ Loaded "${saved.name}"`);
}

function deleteSavedDeck(id) {
  const decks = getSavedDecks().filter(d => d.id !== id);
  setSavedDecks(decks);
  if (currentDeckId === id) currentDeckId = null;
  renderSavedDecksList();
  notify('Deck deleted');
}

// ─── SAVED DECKS MODAL ──────────────────────────────────────────────────────
function renderSavedDecksList() {
  const decks = getSavedDecks();
  const list = $('savedDeckList');
  if (decks.length === 0) {
    list.innerHTML = `<div class="no-saved-decks"><div class="big-icon">📭</div><p>No saved decks yet.<br>Build something and hit Save!</p></div>`;
    return;
  }
  list.innerHTML = '';
  decks.forEach(d => {
    const total = d.cards.reduce((s, e) => s + e.count, 0);
    const color = d.class ? (CLASS_COLORS[d.class] || '#8a7550') : '#8a7550';
    const clsLabel = d.class ? (CLASS_DISPLAY[d.class] || d.class) : 'No Class';
    const date = new Date(d.created || d.updated || Date.now()).toLocaleDateString();
    const el = document.createElement('div');
    el.className = 'saved-deck-item';
    el.innerHTML = `
      <div class="saved-deck-class-dot" style="background:${color}"></div>
      <div class="saved-deck-info">
        <div class="saved-deck-name">${d.name}</div>
        <div class="saved-deck-meta">${clsLabel} · ${total}/30 cards · ${date}</div>
      </div>
      <div class="saved-deck-actions">
        <button class="btn btn-ghost" data-load="${d.id}">Load</button>
        <button class="btn btn-danger" data-del="${d.id}">Delete</button>
      </div>
    `;
    list.appendChild(el);
  });

  list.querySelectorAll('[data-load]').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = getSavedDecks().find(x => x.id === btn.dataset.load);
      if (d) loadDeckFromSave(d);
    });
  });

  list.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => confirmDelete(btn.dataset.del));
  });
}

// ─── CONFIRM DIALOG ──────────────────────────────────────────────────────────
let _confirmResolve = null;
function confirm(msg) {
  return new Promise(resolve => {
    $('confirmMsg').innerHTML = msg;
    $('confirmModal').classList.add('open');
    _confirmResolve = resolve;
  });
}
$('confirmOk').addEventListener('click', () => { $('confirmModal').classList.remove('open'); if (_confirmResolve) _confirmResolve(true); });
$('confirmCancel').addEventListener('click', () => { $('confirmModal').classList.remove('open'); if (_confirmResolve) _confirmResolve(false); });

async function confirmDelete(id) {
  const d = getSavedDecks().find(x => x.id === id);
  if (!d) return;
  const ok = await confirm(`Delete <strong>"${d.name}"</strong>?<br><span style="font-size:0.85rem;color:var(--text-dim);font-style:italic">This cannot be undone.</span>`);
  if (ok) deleteSavedDeck(id);
}

// ─── CLASS CHOOSER ───────────────────────────────────────────────────────────
const PLAYABLE_CLASSES = ['DRUID','HUNTER','MAGE','PALADIN','PRIEST','ROGUE','SHAMAN','WARLOCK','WARRIOR'];

function buildClassChooserGrid() {
  const grid = $('classChooseGrid');
  grid.innerHTML = '';
  PLAYABLE_CLASSES.forEach(cls => {
    const btn = document.createElement('button');
    btn.className = 'class-choose-btn';
    const color = CLASS_COLORS[cls] || '#8a7550';
    btn.style.setProperty('--hover-color', color);
    btn.innerHTML = `<span class="class-choose-icon">${CLASS_ICONS[cls] || '?'}</span><span>${CLASS_DISPLAY[cls] || cls}</span>`;
    btn.addEventListener('click', () => {
      $('classChooserModal').classList.remove('open');
      startNewDeckWithClass(cls);
    });
    grid.appendChild(btn);
  });
}

function startNewDeckWithClass(cls) {
  deck = [];
  currentDeckId = null;
  deckClass = cls;
  $('deckNameInput').value = `${CLASS_DISPLAY[cls] || cls} Deck`;

  // Auto-filter sidebar to show chosen class + neutral
  filters.classes.clear();
  filters.classes.add(cls);
  filters.classes.add('NEUTRAL');

  // Reflect in sidebar class buttons
  document.querySelectorAll('#classFilter .class-btn').forEach(btn => {
    const active = filters.classes.has(btn.dataset.class);
    btn.classList.toggle('active', active);
  });

  applyDeckClassToUI();
  applyFilters();
  renderDeck();
  notify(`New ${CLASS_DISPLAY[cls]} deck started`);
}

function applyDeckClassToUI() {
  const color = deckClass ? (CLASS_COLORS[deckClass] || '#8a7550') : '#7a5f28';
  const label = deckClass ? (CLASS_DISPLAY[deckClass] || deckClass) : 'No Class';

  $('deckClassStripe').style.background = color;
  $('deckClassBadge').textContent = label;
  $('deckClassBadge').style.color = color;
  $('deckClassBadge').style.borderColor = color;

  // Active class banner in sidebar
  if (deckClass && deckClass !== 'NEUTRAL') {
    $('activeClassBanner').classList.add('visible');
    $('activeClassDot').style.background = color;
    $('activeClassLabel').textContent = `${CLASS_DISPLAY[deckClass] || deckClass} + Neutral`;
    $('activeClassLabel').style.color = color;
  } else {
    $('activeClassBanner').classList.remove('visible');
  }
}

$('newDeckBtn').addEventListener('click', () => {
  buildClassChooserGrid();
  $('classChooserModal').classList.add('open');
});
$('classModalClose').addEventListener('click', () => $('classChooserModal').classList.remove('open'));
$('classChooserModal').addEventListener('click', e => { if (e.target === $('classChooserModal')) $('classChooserModal').classList.remove('open'); });

// ─── LOAD JSON ───────────────────────────────────────────────────────────────
function parseAndLoadCards(data) {
  let cards;
  if (Array.isArray(data)) cards = data;
  else if (data.cards) cards = data.cards;
  else if (Array.isArray(Object.values(data)[0])) cards = Object.values(data).flat();
  else cards = Object.values(data);

  allCards = cards.filter(c =>
    c.id && c.name && c.cost !== undefined &&
    ['MINION','SPELL','WEAPON'].includes(c.type) &&
    c.set !== 'HERO_SKINS' && c.set !== 'TAVERN_BRAWL'
  );

  populateClassFilter();
  applyFilters();
  notify(`✓ Loaded ${allCards.length.toLocaleString()} cards`);
}

async function autoLoadCards() {
  $('loadingOverlay').classList.add('show');
  try {
    const res = await fetch('cards/classic.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    parseAndLoadCards(data);
  } catch (err) {
    console.warn('Could not auto-load cards.json:', err);
    $('cardCountInfo').textContent = 'Place cards.json alongside this file, or load manually';
  }
  $('loadingOverlay').classList.remove('show');
}

$('loadBtn').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  $('loadingOverlay').classList.add('show');
  const reader = new FileReader();
  reader.onload = ev => {
    try { parseAndLoadCards(JSON.parse(ev.target.result)); }
    catch(err) { notify('Error reading JSON file'); }
    $('loadingOverlay').classList.remove('show');
    e.target.value = '';
  };
  reader.readAsText(file);
});

// ─── CLASS FILTER POPULATION ─────────────────────────────────────────────────
function populateClassFilter() {
  const classes = [...new Set(allCards.map(c => c.cardClass || 'NEUTRAL'))].sort();
  const wrap = $('classFilter');
  wrap.innerHTML = '';
  classes.forEach(cls => {
    const btn = document.createElement('button');
    btn.className = 'class-btn';
    btn.dataset.class = cls;
    btn.textContent = CLASS_DISPLAY[cls] || cls;
    if (filters.classes.has(cls)) btn.classList.add('active');
    btn.addEventListener('click', () => {
      btn.classList.toggle('active');
      if (filters.classes.has(cls)) filters.classes.delete(cls);
      else filters.classes.add(cls);
      applyFilters();
    });
    wrap.appendChild(btn);
  });
}

$('searchInput').addEventListener('input', e => {

document.querySelectorAll('#manaFilter .mana-btn').forEach(btn => {

// ─── GROUP BY CLASS TOGGLE ───────────────────────────────────────────────────
$('groupByClassBtn').addEventListener('click', () => {

  renderCards();

// ─── APPLY FILTERS ───────────────────────────────────────────────────────────
function applyFilters() {
  filteredCards = allCards.filter(c => {
    if (filters.search) {
      const name = (c.name || '').toLowerCase();
      const text = (c.text || '').toLowerCase();
      if (!name.includes(filters.search) && !text.includes(filters.search)) return false;
    }
    if (filters.mana.size) {
      const cost = c.cost || 0;
      const bucket = cost >= 7 ? '7+' : String(cost);
      if (!filters.mana.has(bucket)) return false;
    }
    if (filters.classes.size) {
      if (!filters.classes.has(c.cardClass || 'NEUTRAL')) return false;
    }
    if (filters.types.size) {
      if (!filters.types.has(c.type)) return false;
    }
    if (filters.rarities.size) {
      if (!filters.rarities.has(c.rarity)) return false;
    }
    return true;
  });

  $('cardCountInfo').textContent = `${allCards.length.toLocaleString()} cards loaded`;
  renderCards();
}

// ─── SORT HELPERS ─────────────────────────────────────────────────────────────
function getSortVal(c) {
  if (sortBy === 'mana')   return (c.cost || 0) * 1e6 + (c.name||'').charCodeAt(0);
  if (sortBy === 'name')   return c.name || '';
  if (sortBy === 'attack') return -(c.attack || 0);
  if (sortBy === 'health') return -(c.health || 0);
  return 0;
}

function sortCards(cards) {
  return [...cards].sort((a, b) => {
    const va = getSortVal(a), vb = getSortVal(b);
    return va < vb ? -1 : va > vb ? 1 : 0;
  });
}

/**
 * Returns an ordered list of class keys present in the given card array.
 * If a deckClass is active it comes first; NEUTRAL always last; rest alphabetical.
 */
function getClassOrder(cards) {
  const present = new Set(cards.map(c => c.cardClass || 'NEUTRAL'));
  const ordered = CLASS_ORDER.filter(cls => present.has(cls));
  // Move deckClass to front if set and present
  if (deckClass && present.has(deckClass)) {
    const idx = ordered.indexOf(deckClass);
    if (idx > 0) { ordered.splice(idx, 1); ordered.unshift(deckClass); }
  }
  return ordered;
}

// ─── RENDER CARDS ────────────────────────────────────────────────────────────
function getDeckCount(card) {
  const entry = deck.find(e => e.card.id === card.id);
  return entry ? entry.count : 0;
}
function getMaxCopies(card) {
  return card.rarity === 'LEGENDARY' ? 1 : 2;
}

function makeCardEl(card) {
  const inDeck   = getDeckCount(card);
  const maxCopies = getMaxCopies(card);
  const deckFull  = deck.reduce((s, e) => s + e.count, 0) >= 30;
  const isMaxed   = inDeck >= maxCopies || (deckFull && inDeck === 0);

  const el = document.createElement('div');
  el.className = 'card-item' + (isMaxed ? ' maxed' : '');
  el.innerHTML = `
    <div class="card-img-wrap">
      <img src="${imgUrl(card.id)}" alt="${card.name}"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
           loading="lazy">
      <div class="card-img-placeholder" style="display:none">
        <span style="font-size:1.5rem">🃏</span>
        <span>${card.name}</span>
      </div>
      ${inDeck > 0 ? `<div class="in-deck-badge">${inDeck}</div>` : ''}
    </div>
    <div class="card-footer">
      <div class="card-name">${card.name}</div>
    </div>
  `;
  el.addEventListener('click', () => addCardToDeck(card));
  el.addEventListener('mouseenter', ev => showTooltip(card, ev));
  el.addEventListener('mousemove',  ev => positionTooltip(ev));
  el.addEventListener('mouseleave', hideTooltip);
  return el;
}

function makeGroupHeader(cls, count) {
  const color = CLASS_COLORS[cls] || '#8a7550';
  const label = CLASS_DISPLAY[cls] || cls;
  const icon  = CLASS_ICONS[cls]  || '';
  const el = document.createElement('div');
  el.className = 'class-group-header';
  el.innerHTML = `
    <div class="class-group-pip" style="background:${color}"></div>
    <div class="class-group-label" style="color:${color}">${icon} ${label}</div>
    <div class="class-group-count">${count}</div>
    <div class="class-group-line" style="background:linear-gradient(90deg,${color}55 0%,transparent 100%)"></div>
  `;
  return el;
}

function renderCards() {
  const grid = $('cardGrid');
  const total = filteredCards.length;
  $('resultsInfo').textContent = `${total.toLocaleString()} cards`;

  if (total === 0) {
    grid.innerHTML = `<div class="empty-state"><div class="big-icon">🔍</div><p>No cards match your filters</p></div>`;
    return;
  }

  const cap = 500;
  if (total > cap) $('resultsInfo').textContent += ` (showing ${cap})`;

  grid.innerHTML = '';

  if (groupByClass) {
    // ── Grouped mode ──────────────────────────────────────────────────────
    const classOrder = getClassOrder(filteredCards);
    let rendered = 0;

    for (const cls of classOrder) {
      if (rendered >= cap) break;

      const group = sortCards(filteredCards.filter(c => (c.cardClass || 'NEUTRAL') === cls));
      if (group.length === 0) continue;

      // Header spans full grid width
      grid.appendChild(makeGroupHeader(cls, group.length));

      const slice = group.slice(0, cap - rendered);
      slice.forEach(card => grid.appendChild(makeCardEl(card)));
      rendered += slice.length;
    }
  } else {
    // ── Flat sorted mode ──────────────────────────────────────────────────
    const sorted = sortCards(filteredCards).slice(0, cap);
    sorted.forEach(card => grid.appendChild(makeCardEl(card)));
  }
}

// ─── TOOLTIP ─────────────────────────────────────────────────────────────────
function stripTags(html) {
  return (html||'').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/\[x\]/g,'');
}
function showTooltip(card, ev) {
  $('ttMana').textContent = card.cost;
  $('ttName').textContent = card.name;
  $('ttRarity').textContent = card.rarity;
  $('ttTag').textContent = card.type;
  $('ttText').textContent = stripTags(card.text) || '(No text)';
  const stats = [];
  if (card.attack !== undefined) stats.push(`<div class="attack-gem">${card.attack}</div>`);
  if (card.health !== undefined) stats.push(`<div class="health-gem">${card.health}</div>`);
  $('ttStats').innerHTML = stats.join(' ');
  $('tooltip').classList.add('visible');
  positionTooltip(ev);
}
function positionTooltip(ev) {
  const tt = $('tooltip');
  const x = ev.clientX + 15, y = ev.clientY - 10;
  tt.style.left = Math.min(x, window.innerWidth - 220) + 'px';
  tt.style.top  = Math.min(y, window.innerHeight - 200) + 'px';
}
function hideTooltip() { $('tooltip').classList.remove('visible'); }

// ─── DECK LOGIC ───────────────────────────────────────────────────────────────
function addCardToDeck(card) {
  const total = deck.reduce((s, e) => s + e.count, 0);
  const entry = deck.find(e => e.card.id === card.id);
  const max = getMaxCopies(card);

  if (entry && entry.count >= max) { notify(`Max ${max} cop${max===1?'y':'ies'} of ${card.name}`); return; }
  if (total >= 30) { notify('Deck is full (30 cards)'); return; }

  if (entry) entry.count++;
  else deck.push({ card, count: 1 });

  renderDeck();
  renderCards();
}

function removeFromDeck(cardId) {
  const idx = deck.findIndex(e => e.card.id === cardId);
  if (idx === -1) return;
  deck[idx].count--;
  if (deck[idx].count === 0) deck.splice(idx, 1);
  renderDeck();
  renderCards();
}

function renderDeck() {
  const list = $('deckList');
  const total = deck.reduce((s, e) => s + e.count, 0);
  $('deckCountNum').textContent = total;

  const sorted = [...deck].sort((a, b) => {
    const ca = a.card, cb = b.card;
    return (ca.cost||0) - (cb.cost||0) || (ca.name||'').localeCompare(cb.name||'');
  });

  list.innerHTML = '';
  sorted.forEach(({card, count}) => {
    const el = document.createElement('div');
    el.className = 'deck-entry';
    const isLeg = card.rarity === 'LEGENDARY';
    el.innerHTML = `
      <div class="deck-entry-mana">${card.cost ?? '?'}</div>
      <div class="deck-entry-thumb">
        <img src="${imgUrl(card.id)}" alt="" onerror="this.style.display='none'" loading="lazy">
      </div>
      <div class="deck-entry-name ${isLeg?'legendary':''}">${isLeg?'◆ ':''}${card.name}</div>
      <div class="deck-entry-count">${count > 1 ? `×${count}` : ''}</div>
      <button class="deck-remove-btn" data-id="${card.id}" title="Remove">−</button>
    `;
    list.appendChild(el);
  });

  list.querySelectorAll('.deck-remove-btn').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); removeFromDeck(btn.dataset.id); });
  });

  renderManaCurve();
}

function renderManaCurve() {
  const curve = $('manaCurve');
  curve.innerHTML = '';
  const buckets = [0,1,2,3,4,5,6,'7+'];
  const counts = {};
  buckets.forEach(b => counts[b] = 0);
  deck.forEach(({card, count}) => {
    const c = card.cost || 0;
    const b = c >= 7 ? '7+' : c;
    counts[b] = (counts[b]||0) + count;
  });
  const maxCount = Math.max(...Object.values(counts), 1);

  buckets.forEach(b => {
    const col = document.createElement('div');
    col.className = 'curve-col';
    const h = Math.round((counts[b] / maxCount) * 18);
    col.innerHTML = `
      <div class="curve-bar-wrap">
        <div class="curve-bar" style="height:${h}px"></div>
      </div>
      <div class="curve-label">${b}</div>
    `;
    curve.appendChild(col);
  });
}

// ─── EXPORT ───────────────────────────────────────────────────────────────────
function buildExportText() {
  const name = $('deckNameInput').value.trim() || 'My Deck';
  const cls = deckClass ? `# Class: ${CLASS_DISPLAY[deckClass] || deckClass}` : '';
  const lines = [`### ${name}`, cls].filter(Boolean);
  const sorted = [...deck].sort((a, b) =>
    (a.card.cost||0) - (b.card.cost||0) || (a.card.name||'').localeCompare(b.card.name||''));
  sorted.forEach(({card, count}) => {
    lines.push(`${count}x ${card.name}`);
  });
  const total = deck.reduce((s,e) => s+e.count, 0);
  lines.push(`\n# ${total}/30 cards`);
  return lines.join('\n');
}

function openExport() {
  if (deck.length === 0) { notify('Your deck is empty!'); return; }
  $('exportText').value = buildExportText();
  $('exportModal').classList.add('open');
}

applyDeckClassToUI();
renderDeck();
renderManaCurve();
