<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Hearthstone Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #222;
            color: #fff;
        }

        .mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #333 url('your-background-image.jpg') center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        .center-button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            cursor: pointer;
        }

        .disabled {
            background: grey;
            cursor: not-allowed;
        }

        .selection-container,
        .game-container {
            display: none;
            height: 100%;
            width: 100%;
        }

        .selection-container.active,
        .game-container.active {
            display: flex;
            flex-direction: column;
        }

        .players {
            flex: 1;
            display: flex;
        }

        .player {
            flex: 1;
            border: 1px solid #555;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        .player h2 {
            margin-bottom: 10px;
        }

        .characters {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .character {
            width: 80px;
            height: 80px;
            background: #444;
            margin: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .character.selected {
            background: #0080ff;
        }

        .middle-button-container {
            text-align: center;
            margin: 20px;
        }

        .game-info {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px;
            width: 100%;
            max-width: 400px;
        }

        .counter-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .counter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .counter {
            font-size: 16px;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 8px;
            min-width: 60px;
            text-align: center;
            user-select: none;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
            flex: 1;
            cursor: pointer;
        }

        .counter-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            user-select: none;
        }

        .counter-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        .counter-btn:active {
            transform: scale(0.95);
        }
        
        /* Unique styles for each counter type */
        .health {
            background-color: #ac2326;
            color: #fff;
        }
        
        .health-btn {
            background-color: #d63031;
            color: #fff;
        }
        
        .armour {
            background-color: #6e6c6a;
            color: #fff;
        }
        
        .armour-btn {
            background-color: #8e8b89;
            color: #fff;
        }
        
        .mana {
            background-color: #3456ad;
            color: #fff;
        }
        
        .mana-btn {
            background-color: #4a6cd6;
            color: #fff;
        }
        
        .fatigue {
            background-color: #353331;
            color: #fff;
        }
        
        .fatigue-btn {
            background-color: #454341;
            color: #fff;
        }

        .hero-power {
            background-color: #7a28c2;
            color: #fff;
        }

        .rng-container {
            text-align: center;
            margin-top: 10px;
        }

        .rng-container input {
            width: 50px;
            padding: 5px;
            margin-right: 5px;
            text-align: center;
        }

        .fade {
            transition: opacity 0.5s ease-in-out;
            opacity: 1;
        }

        .glow {
            color: #fff;
            text-shadow: 0 0 10px yellow;
        }

        /* Coin flip animation styles */
        .coin-flip-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .coin-flip-overlay.active {
            display: flex;
        }

        .coin {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            border: 4px solid #b8860b;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #8b4513;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            animation: coinFlip 2s ease-in-out;
        }

        .coin-result {
            margin-top: 30px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            color: #fff;
            opacity: 0;
            animation: fadeInResult 0.5s ease-in-out 2.2s forwards;
        }

        @keyframes coinFlip {
            0% {
                transform: rotateY(0deg) rotateX(0deg);
            }
            25% {
                transform: rotateY(900deg) rotateX(180deg) scale(1.2);
            }
            50% {
                transform: rotateY(1800deg) rotateX(360deg) scale(1.1);
            }
            75% {
                transform: rotateY(2700deg) rotateX(540deg) scale(1.2);
            }
            100% {
                transform: rotateY(3600deg) rotateX(720deg) scale(1);
            }
        }

        @keyframes fadeInResult {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .coin-flip-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>

<body>
    <!-- Mask and Setup Game Button -->
    <div id="mask" class="mask">
        <button id="setupBtn" class="center-button">Setup Game</button>
    </div>

    <!-- Selection Screen -->
    <div id="selectionScreen" class="selection-container">
        <div class="players">
            <div class="player" id="player1">
                <h2>Player 1</h2>
                <div class="characters" id="characters1">
                    <!-- 9 character options -->
                    <div class="character" data-name="Warrior">Warrior</div>
                    <div class="character" data-name="Mage">Mage</div>
                    <div class="character" data-name="Rogue">Rogue</div>
                    <div class="character" data-name="Hunter">Hunter</div>
                    <div class="character" data-name="Priest">Priest</div>
                    <div class="character" data-name="Warlock">Warlock</div>
                    <div class="character" data-name="Paladin">Paladin</div>
                    <div class="character" data-name="Druid">Druid</div>
                    <div class="character" data-name="Shaman">Shaman</div>
                </div>
            </div>
            <div class="player" id="player2">
                <h2>Player 2</h2>
                <div class="characters" id="characters2">
                    <!-- 9 character options -->
                    <div class="character" data-name="Warrior">Warrior</div>
                    <div class="character" data-name="Mage">Mage</div>
                    <div class="character" data-name="Rogue">Rogue</div>
                    <div class="character" data-name="Hunter">Hunter</div>
                    <div class="character" data-name="Priest">Priest</div>
                    <div class="character" data-name="Warlock">Warlock</div>
                    <div class="character" data-name="Paladin">Paladin</div>
                    <div class="character" data-name="Druid">Druid</div>
                    <div class="character" data-name="Shaman">Shaman</div>
                </div>
            </div>
        </div>
        <div class="middle-button-container">
            <button id="startGameBtn" class="center-button disabled" disabled>Start Game</button>
        </div>
    </div>

    <!-- Coin Flip Animation -->
    <div id="coinFlipOverlay" class="coin-flip-overlay">
        <div class="coin-flip-container">
            <div class="coin" id="coin">•</div>
            <div class="coin-result" id="coinResult"></div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="game-container">
        <div class="players">
            <div class="player" id="gamePlayer1">
                <h2 id="gamePlayer1Name"></h2>
                <div class="game-info">
                    <!-- Top Row: Health and Mana -->
                    <div class="counter-row">
                        <div class="counter-group">
                            <button class="counter-btn health-btn" onclick="adjustCounter('p1Health', -1)">−</button>
                            <div class="counter health" id="p1Health">❤️ 30</div>
                            <button class="counter-btn health-btn" onclick="adjustCounter('p1Health', 1)">+</button>
                        </div>
                        <div class="counter-group">
                            <button class="counter-btn mana-btn" onclick="adjustCounter('p1Mana', -1)">−</button>
                            <div class="counter mana" id="p1Mana">💎 0</div>
                            <button class="counter-btn mana-btn" onclick="adjustCounter('p1Mana', 1)">+</button>
                        </div>
                    </div>
                    <!-- Middle Row: Armour and Fatigue -->
                    <div class="counter-row">
                        <div class="counter-group">
                            <button class="counter-btn armour-btn" onclick="adjustCounter('p1Armour', -1)">−</button>
                            <div class="counter armour" id="p1Armour">🛡️ 0</div>
                            <button class="counter-btn armour-btn" onclick="adjustCounter('p1Armour', 1)">+</button>
                        </div>
                        <div class="counter-group">
                            <button class="counter-btn fatigue-btn" onclick="adjustCounter('p1Fatigue', -1)">−</button>
                            <div class="counter fatigue" id="p1Fatigue">💀 0</div>
                            <button class="counter-btn fatigue-btn" onclick="adjustCounter('p1Fatigue', 1)">+</button>
                        </div>
                    </div>
                    <!-- Bottom Row: Hero Power -->
                    <div class="counter-row">
                        <div class="counter-group">
                            <div class="counter hero-power" onclick="heroPower('p1')">Hero Power</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="player" id="gamePlayer2">
                <h2 id="gamePlayer2Name"></h2>
                <div class="game-info">
                    <!-- Top Row: Health and Mana -->
                    <div class="counter-row">
                        <div class="counter-group">
                            <button class="counter-btn health-btn" onclick="adjustCounter('p2Health', -1)">−</button>
                            <div class="counter health" id="p2Health">❤️ 30</div>
                            <button class="counter-btn health-btn" onclick="adjustCounter('p2Health', 1)">+</button>
                        </div>
                        <div class="counter-group">
                            <button class="counter-btn mana-btn" onclick="adjustCounter('p2Mana', -1)">−</button>
                            <div class="counter mana" id="p2Mana">💎 0</div>
                            <button class="counter-btn mana-btn" onclick="adjustCounter('p2Mana', 1)">+</button>
                        </div>
                    </div>
                    <!-- Middle Row: Armour and Fatigue -->
                    <div class="counter-row">
                        <div class="counter-group">
                            <button class="counter-btn armour-btn" onclick="adjustCounter('p2Armour', -1)">−</button>
                            <div class="counter armour" id="p2Armour">🛡️ 0</div>
                            <button class="counter-btn armour-btn" onclick="adjustCounter('p2Armour', 1)">+</button>
                        </div>
                        <div class="counter-group">
                            <button class="counter-btn fatigue-btn" onclick="adjustCounter('p2Fatigue', -1)">−</button>
                            <div class="counter fatigue" id="p2Fatigue">💀 0</div>
                            <button class="counter-btn fatigue-btn" onclick="adjustCounter('p2Fatigue', 1)">+</button>
                        </div>
                    </div>
                    <!-- Bottom Row: Hero Power -->
                    <div class="counter-row">
                        <div class="counter-group">
                            <div class="counter hero-power" onclick="heroPower('p2')">Hero Power</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="middle-button-container">
            <button id="turnBtn" class="center-button fade">End Turn</button>
        </div>
        <div class="rng-container">
            <input type="number" id="rngMax" placeholder="Max">
            <button id="rngBtn" class="center-button fade">Roll RNG</button>
            <div id="rngResult"></div>
        </div>
    </div>

    <script>
        // Global game state
        var player1 = { name: null, class: null, health: 30, armour: 0, mana: 0, fatigue: 0 };
        var player2 = { name: null, class: null, health: 30, armour: 0, mana: 0, fatigue: 0 };
        var currentTurn = null; // 'player1' or 'player2'

        // Elements
        const mask = document.getElementById('mask');
        const setupBtn = document.getElementById('setupBtn');
        const selectionScreen = document.getElementById('selectionScreen');
        const startGameBtn = document.getElementById('startGameBtn');
        const characters1 = document.getElementById('characters1');
        const characters2 = document.getElementById('characters2');
        const gameScreen = document.getElementById('gameScreen');
        const gamePlayer1Name = document.getElementById('gamePlayer1Name');
        const gamePlayer2Name = document.getElementById('gamePlayer2Name');
        const turnBtn = document.getElementById('turnBtn');
        const rngBtn = document.getElementById('rngBtn');
        const rngMax = document.getElementById('rngMax');
        const rngResult = document.getElementById('rngResult');
        const coinFlipOverlay = document.getElementById('coinFlipOverlay');
        const coinResult = document.getElementById('coinResult');

        let selection = { player1: null, player2: null };

        // Setup: reveal selection screen on setup button click
        setupBtn.addEventListener('click', () => {
            mask.classList.add('hidden');
            // Show selection screen after transition
            setTimeout(() => {
                selectionScreen.classList.add('active');
            }, 500);
        });

        function updateTextWithFade(newText, element) {
            // Fade out by setting opacity to 0.
            element.style.opacity = 0;

            // Wait for the fade-out transition to complete (0.5s in this case).
            setTimeout(() => {
                // Update the text content with the new text.
                element.textContent = newText;

                // Fade the element back in.
                element.style.opacity = 1;
            }, 500); // This delay should match the CSS transition duration.
        }

        // Handle character selection
        function setupCharacterSelection(playerDiv, playerKey) {
            playerDiv.querySelectorAll('.character').forEach(character => {
                character.addEventListener('click', () => {
                    // Unselect any previously selected character
                    playerDiv.querySelectorAll('.character').forEach(c => c.classList.remove('selected'));
                    character.classList.add('selected');
                    selection[playerKey] = character.getAttribute('data-name');
                    // Enable start button if both players have selected
                    if (selection.player1 && selection.player2) {
                        startGameBtn.disabled = false;
                        startGameBtn.classList.remove('disabled');
                    }
                });
            });
        }
        setupCharacterSelection(characters1, 'player1');
        setupCharacterSelection(characters2, 'player2');

        // Start game button click
        startGameBtn.addEventListener('click', () => {
            // Set player names from selection
            player1.name = "[P1] " + selection.player1;
            player2.name = "[P2] " + selection.player2;

            player1.class = selection.player1;
            player2.class = selection.player2;
            
            // Show coin flip animation
            coinFlipOverlay.classList.add('active');
            
            // Decide who goes first with coinflip
            const firstPlayer = (Math.random() < 0.5) ? 'player1' : 'player2';
            currentTurn = firstPlayer;
            
            // Show result after animation
            setTimeout(() => {
                const winnerName = firstPlayer === 'player1' ? player1.name : player2.name;
                coinResult.textContent = `${winnerName} goes first!`;
            }, 2200);
            
            // Hide overlay and start game after full animation
            setTimeout(() => {
                coinFlipOverlay.classList.remove('active');
                
                // Reset coin result for next time
                setTimeout(() => {
                    coinResult.textContent = '';
                }, 500);
                
                // Set up initial game state
                if (currentTurn === 'player1') {
                    player1.mana++;
                    document.getElementById('p1Mana').textContent = `💎 ${player1.mana}`;
                    gamePlayer1Name.classList.add("glow");
                } else {
                    player2.mana++;
                    document.getElementById('p2Mana').textContent = `💎 ${player2.mana}`;
                    gamePlayer2Name.classList.add("glow");
                }
                
                // Set names on game screen
                gamePlayer1Name.textContent = player1.name;
                gamePlayer2Name.textContent = player2.name;
                
                // Hide selection screen and show game screen
                selectionScreen.classList.remove('active');
                gameScreen.classList.add('active');
                updateTextWithFade(`End ${currentTurn === 'player1' ? player1.name : player2.name}'s turn`, turnBtn);
            }, 3500);
        });

        // End turn button click
        turnBtn.addEventListener('click', () => {
            // Switch turn and increment mana (max 10) for the new current turn
            currentTurn = currentTurn === 'player1' ? 'player2' : 'player1';
            if (currentTurn === 'player1') {
                if (player1.mana < 10) player1.mana++;
                document.getElementById('p1Mana').textContent = `💎 ${player1.mana}`;
                gamePlayer1Name.classList.add("glow");
                gamePlayer2Name.classList.remove("glow");
            } else {
                if (player2.mana < 10) player2.mana++;
                document.getElementById('p2Mana').textContent = `💎 ${player2.mana}`;
                gamePlayer1Name.classList.remove("glow");
                gamePlayer2Name.classList.add("glow");
            }

            updateTextWithFade(`End ${currentTurn === 'player1' ? player1.name : player2.name}'s turn`, turnBtn);
        });

        // Function to adjust counters (this was missing!)
        function adjustCounter(counterId, change) {
            // Determine which player and property based on counterId
            let playerVar, property, emoji;
            
            if (counterId.includes('p1')) {
                playerVar = player1;
            } else {
                playerVar = player2;
            }
            
            if (counterId.includes('Health')) {
                property = 'health';
                emoji = '❤️';
            } else if (counterId.includes('Armour')) {
                property = 'armour';
                emoji = '🛡️';
            } else if (counterId.includes('Mana')) {
                property = 'mana';
                emoji = '💎';
            } else if (counterId.includes('Fatigue')) {
                property = 'fatigue';
                emoji = '💀';
            }
            
            // Update the state
            playerVar[property] += change;
            
            // Prevent negative values for most properties
            if (property !== 'health' && playerVar[property] < 0) {
                playerVar[property] = 0;
            }
            
            // Cap mana at 10
            if (property === 'mana' && playerVar[property] > 10) {
                playerVar[property] = 10;
            }
            
            // Update the display
            document.getElementById(counterId).textContent = `${emoji} ${playerVar[property]}`;
        }

        // Allow manual editing by clicking on counters
        function setupCounterEdit(counterId, playerKey, property) {
            const counterElem = document.getElementById(counterId);
            const playerVar = playerKey == 'player1' ? player1 : player2;
            counterElem.addEventListener('click', () => {
                const newVal = prompt(`Set new value for ${property} for ${playerVar.name}:`, playerVar[property]);
                const num = parseInt(newVal);
                if (!isNaN(num)) {
                    playerVar[property] = num;
                    let emoji = '';
                    if (property === 'health') emoji = '❤️';
                    else if (property === 'armour') emoji = '🛡️';
                    else if (property === 'mana') emoji = '💎';
                    else if (property === 'fatigue') emoji = '💀';
                    counterElem.textContent = `${emoji} ${num}`;
                }
            });
        }
        setupCounterEdit('p1Health', 'player1', 'health');
        setupCounterEdit('p1Armour', 'player1', 'armour');
        setupCounterEdit('p1Mana', 'player1', 'mana');
        setupCounterEdit('p1Fatigue', 'player1', 'fatigue');
        setupCounterEdit('p2Health', 'player2', 'health');
        setupCounterEdit('p2Armour', 'player2', 'armour');
        setupCounterEdit('p2Mana', 'player2', 'mana');
        setupCounterEdit('p2Fatigue', 'player2', 'fatigue');

        // RNG functionality
        rngBtn.addEventListener('click', () => {
            const max = parseInt(rngMax.value);
            if (!isNaN(max) && max > 0) {
                const roll = Math.floor(Math.random() * max) + 1;
                updateTextWithFade(`Rolled: ${roll}`, rngBtn);
            } else {
                rngResult.textContent = `Please enter a valid max number.`;
                setTimeout(() => {
                    rngResult.textContent = ``;
                }, 1000);
            }
        });

        function heroPower(playerKey) {
            const playerVar = playerKey == 'p1' ? player1 : player2;
            const opponentVar = playerKey == 'p2' ? player1 : player2;
            const opponentKey = playerKey == 'p1' ? 'p2' : 'p1';

            if (playerVar.mana < 2)
                return;

            switch (playerVar.class) {
                case 'Mage':
                    adjustCounter(opponentKey + "Health", -1);
                    break;
                case 'Warrior':
                    adjustCounter(playerKey + "Armour", 2);
                    break;
                case 'Druid':
                    adjustCounter(playerKey + "Armour", 1);
                    adjustCounter(opponentKey + "Health", -1);
                    break;
                case 'Warlock':
                    adjustCounter(playerKey + "Health", -2);
                    break;
                case 'Hunter':
                    adjustCounter(opponentKey + "Health", -2);
                    break;
                case 'Priest':
                    adjustCounter(playerKey + "Health", 2);
                    break;
                case 'Rogue':
                case 'Paladin':
                case 'Shaman':
                    break;
            }
        }

        function renderButtons() {

        }
    </script>
</body>

</html>
